<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicStream - Loading...</title>
    <script>
        // Smart Entry Point Router: Detects screen size and redirects to desktop.html or mobile.html
        (function() {
            var isMobile = window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                window.location.replace("mobile.html");
            } else {
                window.location.replace("desktop.html");
            }
        })();
    </script>
</head>
<body style="background: #0d1117; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to SonicStream...</p>
</body>
</html>
