<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#00f2fe">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SonicStream - Mobile Player</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon-mobile.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- MSAL.js for Microsoft OneDrive Authentication -->
    <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    
    <!-- SonicStream Config & Manifest Fallback -->
    <script src="config.js"></script>
    <script src="manifest_fallback.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <style>
        /* Dedicated Mobile UX Overrides */
        body {
            overflow-x: hidden;
            padding-bottom: 120px;
        }
        .mobile-header {
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .mobile-playlist-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0.85rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .mobile-playlist-card:active {
            transform: scale(0.98);
            border-color: var(--neon-blue);
        }
        .mobile-card-thumb {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: #111;
        }
        .mobile-card-info {
            flex: 1;
            min-width: 0;
        }
        .mobile-card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.25rem;
        }
        .mobile-card-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .mobile-back-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0.75rem;
        }
        .mobile-track-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
        }
        .mobile-track-item:active {
            background: rgba(0, 242, 254, 0.08);
        }
        .mobile-track-thumb {
            width: 46px;
            height: 46px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .mobile-track-details {
            flex: 1;
            min-width: 0;
        }
        .mobile-track-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mobile-track-artist {
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <!-- Background Glow Effects -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- Mobile Header Bar -->
    <header class="mobile-header">
        <div id="appHomeLogo" title="Home" style="display: flex; align-items: center; cursor: pointer;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="url(#mGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <defs>
                    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="var(--neon-blue)"/>
                        <stop offset="100%" stop-color="var(--neon-pink)"/>
                    </linearGradient>
                </defs>
                <path d="M9 18V5l12-2v13" fill="none"/>
                <circle cx="6" cy="18" r="3" fill="url(#mGrad)" stroke="none"/>
                <circle cx="18" cy="16" r="3" fill="url(#mGrad)" stroke="none"/>
            </svg>
        </div>

        <div style="display: flex; align-items: center; gap: 0.4rem;">
            <!-- Trace Logs / Live Console -->
            <button class="btn btn-secondary btn-sm" id="btnToggleConsole" title="Trace Logs" style="padding: 0.3rem 0.45rem; font-size: 0.75rem; border-radius: 8px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            </button>

            <!-- Hard Refresh / Update (busts PWA cache to fetch latest app) -->
            <button class="btn btn-secondary btn-sm" id="btnHardRefresh" title="Update app to latest version" style="padding: 0.3rem 0.45rem; font-size: 0.75rem; border-radius: 8px; border-color: var(--neon-blue); color: var(--neon-blue);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            </button>

            <!-- Settings Button -->
            <button class="btn btn-secondary btn-sm" id="btnOpenSettings" style="padding: 0.3rem 0.5rem; font-size: 0.75rem; border-radius: 8px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            
            <!-- Switch to Desktop Link -->
            <a href="desktop.html" class="btn btn-secondary btn-sm" style="padding: 0.3rem 0.6rem; font-size: 0.75rem; border-radius: 8px; text-decoration: none; border-color: var(--neon-blue); color: #fff;">
                <span>🖥️ Desktop</span>
            </a>
        </div>
    </header>

    <!-- Mobile Main Container -->
    <div style="padding: 1rem 0.85rem;">
        
        <!-- View 1: Playlists Overview Cards (Default) -->
        <div id="mobilePlaylistsView">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.85rem;">
                <h2 style="font-size: 1.25rem; font-weight: 800; font-family: 'Space Grotesk', sans-serif;">Your Playlists</h2>
                <button id="btnSyncMobile" class="btn btn-secondary btn-sm" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;">
                    🔄 Refresh
                </button>
            </div>
            <div id="mobilePlaylistsList">
                <!-- Mobile playlist cards injected dynamically -->
            </div>
        </div>

        <!-- View 2: Playlist Tracks Detail View (Hidden by default) -->
        <div id="mobileTracksView" style="display: none;">
            <div class="mobile-back-bar">
                <button id="btnBackToPlaylists" class="btn btn-secondary btn-sm" style="padding: 0.35rem 0.7rem; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 0.3rem;">
                    ← Back to Playlists
                </button>
                <span id="mobileCurrentPlaylistTitle" style="font-weight: 700; font-size: 0.95rem; color: var(--neon-blue);">Playlist Title</span>
            </div>

            <div id="mobileTrackList">
                <!-- Single-column mobile tracks injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Hidden elements for script compatibility -->
    <div style="display: none;">
        <input type="text" id="urlInput">
        <button id="analyzeBtn"></button>
        <span id="analyzeSpinner"></span>
        <span id="urlError"></span>
        <button id="btnSyncOneDriveNow"></button>
        <button id="btnSaveOffline"></button>
        <div id="playlistList"></div>
        <div id="playlistTrackCount"></div>
        <div id="playlistMetaInfo"></div>
        <div id="itemsGrid"></div>
        <button id="refreshPlaylistBtn"></button>
        <button id="downloadAllBtn"></button>
        <button id="downloadBtn"></button>
        <button id="btnPrefetch3"></button>
        <button id="btnLoginOneDrive"></button>
        <span id="loginBtnText"></span>
    </div>

    <!-- Mobile Docked Bottom Audio Player Bar -->
    <div class="player-bar" style="position: fixed; bottom: 0; left: 0; right: 0; background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border-color); padding: 0.75rem 1rem; z-index: 1000; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);">
        <!-- Audio playback sink (required by the shared player engine) -->
        <audio id="audioElement" preload="metadata"></audio>

        <!-- Volume popup (toggled by the volume button; slides up above the bar) -->
        <div id="volumePopup" style="display: none; position: absolute; bottom: 100%; left: 1rem; margin-bottom: 0.6rem; background: rgba(13,17,23,0.98); border: 1px solid var(--neon-blue); border-radius: 14px; padding: 0.85rem 1rem; box-shadow: 0 -6px 24px rgba(0,0,0,0.6); align-items: center; gap: 0.7rem;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color: var(--neon-blue); flex-shrink: 0;"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
            <input type="range" id="playerVolumeSlider" min="0" max="100" value="100" style="width: 160px; accent-color: var(--neon-blue);">
            <span id="volumePct" style="font-size: 0.8rem; color: var(--text-secondary); min-width: 40px; text-align: right;">100%</span>
        </div>

        <div style="display: flex; align-items: center; gap: 0.65rem;">
            <img id="playerTrackThumb" src="icon.svg" style="width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #222; flex-shrink: 0;">

            <div style="flex: 1; min-width: 0;">
                <div id="playerTrackTitle" style="font-weight: 700; font-size: 0.95rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Select a track</div>
                <div id="playerTrackArtist" style="font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">SonicStream Player</div>
            </div>

            <!-- Transport Controls: Prev / Play-Pause / Next (square buttons) -->
            <div style="display: flex; align-items: center; gap: 0.3rem; flex-shrink: 0;">
                <button id="playerPrevBtn" title="Previous track" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-primary); cursor: pointer; width: 50px; height: 50px; padding: 0; display: flex; align-items: center; justify-content: center;">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>
                <button id="playerPlayPauseBtn" class="btn btn-primary" title="Play / Pause" style="width: 60px; height: 60px; border-radius: 12px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <svg id="playIconSvg" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button id="playerNextBtn" title="Next track" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-primary); cursor: pointer; width: 50px; height: 50px; padding: 0; display: flex; align-items: center; justify-content: center;">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>

        <!-- Progress bar row with volume toggle on the left -->
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem;">
            <button id="btnVolumeToggle" title="Volume" style="background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 2px 4px; display: flex; align-items: center; flex-shrink: 0;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <span id="playerCurrentTime" style="font-size: 0.72rem; color: var(--text-muted); font-family: 'Fira Code', monospace; min-width: 32px;">0:00</span>
            <input type="range" id="playerProgressBar" min="0" max="100" value="0" step="any" style="flex: 1; accent-color: var(--neon-blue); height: 5px;">
            <span id="playerTotalTime" style="font-size: 0.72rem; color: var(--text-muted); font-family: 'Fira Code', monospace; min-width: 32px;">0:00</span>
        </div>
    </div>

    <!-- Hidden Video Container (audio-only mobile; kept for engine guards) -->
    <div id="videoContainer" style="display: none;"></div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3>SonicStream Mobile Settings</h3>
                <button id="btnCloseSettings" class="close-btn">&times;</button>
            </div>
            
            <div class="modal-body" style="max-height: 75vh; overflow-y: auto; padding-right: 0.5rem;">
                <div class="settings-section">
                    <h4>Microsoft Entra ID (Azure AD) Client ID</h4>
                    <input type="text" id="azureClientIdInput" placeholder="Paste Client ID here...">
                </div>

                <hr class="divider">

                <div class="settings-section">
                    <h4>Azure Cloud Storage Access (Secret SAS Token)</h4>
                    <input type="text" id="azureSasTokenInput" placeholder="Enter Azure Storage SAS Token here...">
                </div>

                <!-- OneDrive removed (audio streams from Azure Blob). Hidden stub for engine guards. -->
                <input type="hidden" id="oneDriveFolderNameInput" value="">

                <hr class="divider">

                <div class="settings-section">
                    <h4>Offline Storage Management</h4>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span id="cacheUsageText">Checking offline cache...</span>
                        <button id="btnClearCache" class="btn btn-secondary btn-sm">Clear Offline Cache</button>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button id="btnSaveSettings" class="btn btn-primary">Save & Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
