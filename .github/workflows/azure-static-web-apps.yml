name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      # config.js is gitignored (it used to carry the SAS token). The service
      # worker precaches it, so generate a secret-free copy from settings.json.
      # The SAS token is pasted once per device in the app's Settings.
      - name: Generate secret-free config.js
        run: |
          python3 - <<'PY'
          import json
          settings = json.load(open("web-pwa/settings.json"))
          settings["azure_sas_token"] = ""
          with open("web-pwa/config.js", "w") as f:
              f.write("// Generated at deploy time (no secrets)\nwindow.SONICSTREAM_CONFIG = " + json.dumps(settings, indent=2) + ";\n")
          PY

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/web-pwa"
          api_location: ""
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepr
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
